<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Video Feedback Delay</title>

    <!-- PWA Meta Tags -->
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#000000">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <link rel="apple-touch-icon" href="logo.png">

    <style>
        /* Minimaler Reset (ersetzt Tailwind: keine externe Abhängigkeit, offline-fähig) */
        *, *::before, *::after { box-sizing: border-box; }
        button, input { font: inherit; color: inherit; margin: 0; }
        button { background: none; border: 0; padding: 0; cursor: pointer; -webkit-tap-highlight-color: transparent; }
        h2, p, ul { margin: 0; }
        img, svg { display: block; }
        [hidden] { display: none !important; }

        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #000;
            color: white;
            font-family: sans-serif;
            touch-action: none;
            -webkit-user-select: none;
            user-select: none;
        }

        /* ============================================================= */
        /* LAYOUT: fixed statt 100vh (iOS-Adressleiste), Ansichten       */
        /* im Hochformat übereinander, im Querformat nebeneinander       */
        /* ============================================================= */
        #app { position: fixed; inset: 0; background: #000; }
        #workbench {
            position: absolute;
            inset: 0;
            display: flex;
            flex-direction: column;
            gap: 2px;
            background: #000;
        }
        @media (min-aspect-ratio: 1/1) {
            #workbench { flex-direction: row; }
        }
        .pane {
            position: relative;
            flex: 1 1 0;
            min-width: 0;
            min-height: 0;
            overflow: hidden;
            background: #111;
        }
        .pane[hidden] { display: none; }
        .pane canvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }

        .grid-overlay { position: absolute; inset: 0; pointer-events: none; z-index: 5; }
        .grid-line { position: absolute; background: rgba(255, 255, 255, 0.25); pointer-events: none; }

        .status-msg {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            text-align: center;
            background: rgba(0,0,0,0.7);
            padding: 20px;
            border-radius: 15px;
            pointer-events: none;
            max-width: 80%;
            z-index: 6;
        }
        .status-msg[hidden] { display: none; }
        .spinner {
            width: 32px;
            height: 32px;
            margin: 0 auto 8px;
            border-radius: 9999px;
            border-bottom: 2px solid #fff;
            animation: spin 1s linear infinite;
        }
        @keyframes spin { to { transform: rotate(360deg); } }

        /* Globale Buttons: Abstand zu Notch / abgerundeten Ecken (safe area) */
        .top-left, .top-right {
            position: absolute;
            top: max(16px, env(safe-area-inset-top));
            display: flex;
            gap: 12px;
            z-index: 20;
        }
        .top-left { left: max(16px, env(safe-area-inset-left)); flex-direction: column; }
        .top-right { right: max(16px, env(safe-area-inset-right)); }

        /* Runde Glas-Buttons */
        .glass-btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            background: rgba(0, 0, 0, 0.4);
            padding: 16px;
            border-radius: 9999px;
            border: 1px solid rgba(255, 255, 255, 0.2);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            color: #fff;
            cursor: pointer;
        }
        .glass-btn:active { background: rgba(255, 255, 255, 0.2); }
        .glass-btn[hidden] { display: none; }
        .glass-btn svg { width: 24px; height: 24px; }
        /* Zwei-Ansichten-Button aktiv: hellblau */
        .glass-btn.on { background: #60a5fa; color: #0f172a; border-color: rgba(255, 255, 255, 0.35); }

        /* ============================================================= */
        /* STEUERUNG PRO ANSICHT                                         */
        /* ============================================================= */
        .pane-controls {
            position: absolute;
            left: 0;
            right: 0;
            bottom: 0;
            z-index: 10;
            display: flex;
            flex-direction: column;
            gap: 14px;
            padding: 16px max(16px, env(safe-area-inset-right)) max(28px, calc(env(safe-area-inset-bottom) + 12px)) max(16px, env(safe-area-inset-left));
            background: linear-gradient(to top, rgba(0,0,0,0.9), rgba(0,0,0,0.4) 60%, rgba(0,0,0,0));
        }
        .ctl-row { display: flex; align-items: flex-end; justify-content: space-between; gap: 12px; }
        .ctl-group { display: flex; align-items: center; gap: 12px; }
        .timer-group { display: flex; align-items: flex-start; gap: 8px; }
        .delay-timer {
            font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
            font-size: 30px;
            line-height: 1.25;
            font-weight: 700;
            background: rgba(0,0,0,0.6);
            padding: 4px 18px;
            border-radius: 12px;
            border: 1px solid rgba(255,255,255,0.1);
            font-variant-numeric: tabular-nums;
        }
        .delay-timer.frozen { border-color: rgba(250, 204, 21, 0.8); color: #fde68a; }
        .timer-label {
            font-size: 10px;
            text-transform: uppercase;
            letter-spacing: 0.2em;
            opacity: 0.6;
            font-weight: 600;
            margin: 4px 0 0 4px;
        }
        .reset-btn { padding: 10px; }
        .reset-btn svg { width: 22px; height: 22px; }

        .speed-btn {
            min-width: 64px;
            height: 58px;
            padding: 0 16px;
            font-size: 18px;
            font-weight: 700;
            font-family: ui-monospace, monospace;
        }
        .speed-btn.slow { color: #facc15; border-color: rgba(250, 204, 21, 0.6); }

        .pause-btn {
            width: 64px;
            height: 64px;
            border-radius: 9999px;
            border: 1px solid rgba(255, 255, 255, 0.35);
            background: #60a5fa;
            color: #0f172a;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 4px 14px rgba(0, 0, 0, 0.35);
            transition: transform 0.15s, background 0.15s;
            cursor: pointer;
        }
        .pause-btn:active { transform: scale(0.94); background: #3b82f6; }
        .pause-btn svg { width: 28px; height: 28px; }

        .slider-row { display: flex; align-items: center; gap: 12px; font-size: 10px; font-weight: 700; }
        .slider-row span { opacity: 0.4; }
        .delay-slider {
            -webkit-appearance: none;
            appearance: none;
            flex: 1;
            min-width: 0;
            height: 12px;
            background: rgba(255, 255, 255, 0.2);
            border-radius: 6px;
            outline: none;
        }
        .delay-slider::-webkit-slider-thumb {
            -webkit-appearance: none;
            appearance: none;
            width: 32px;
            height: 32px;
            background: #fff;
            border-radius: 50%;
            cursor: pointer;
            box-shadow: 0 0 15px rgba(0,0,0,0.6);
            border: 2px solid rgba(0,0,0,0.1);
        }
        .delay-slider::-moz-range-thumb {
            width: 32px;
            height: 32px;
            background: #fff;
            border-radius: 50%;
            border: 2px solid rgba(0,0,0,0.1);
        }

        /* Kompakt: zwei Ansichten oder wenig Höhe (Handy quer) */
        #app.dual .top-left,
        #app.short .top-left { flex-direction: row; }
        #app.dual .glass-btn:not(.speed-btn):not(.reset-btn),
        #app.short .glass-btn:not(.speed-btn):not(.reset-btn) { padding: 12px; }
        #app.dual .glass-btn svg, #app.short .glass-btn svg { width: 22px; height: 22px; }
        #app.dual .pane-controls,
        #app.short .pane-controls {
            gap: 10px;
            padding-top: 10px;
            padding-bottom: max(14px, calc(env(safe-area-inset-bottom) + 6px));
        }
        #app.dual .delay-timer, #app.short .delay-timer { font-size: 22px; padding: 2px 12px; }
        #app.dual .speed-btn, #app.short .speed-btn { height: 46px; min-width: 54px; font-size: 16px; }
        #app.dual .pause-btn, #app.short .pause-btn { width: 50px; height: 50px; }
        #app.dual .pause-btn svg, #app.short .pause-btn svg { width: 24px; height: 24px; }
        #app.dual .reset-btn, #app.short .reset-btn { padding: 8px; }
        #app.dual .delay-slider::-webkit-slider-thumb,
        #app.short .delay-slider::-webkit-slider-thumb { width: 26px; height: 26px; }
        /* Zwei Ansichten im Querformat: die Steuerung der linken Ansicht
           braucht rechts keinen Notch-Abstand, die der rechten links keinen */
        @media (min-aspect-ratio: 1/1) {
            #app.dual .pane:first-child .pane-controls { padding-right: 16px; }
            #app.dual .pane:last-child .pane-controls { padding-left: 16px; }
        }

        /* ============================================================= */
        /* SPLASH SCREEN - Logo beim Start, blendet nach 2 s aus         */
        /* ============================================================= */
        #splash-screen {
            position: fixed;
            inset: 0;
            background-color: #000;
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 9999;
            transition: opacity 0.5s ease-out, visibility 0.5s;
        }
        #splash-screen img { max-width: 250px; width: 60%; height: auto; object-fit: contain; }
        #splash-screen.fade { opacity: 0; visibility: hidden; }

        /* ============================================================= */
        /* OVERLAY SCREENS - Willkommen + Info (wie Video Analyser)      */
        /* ============================================================= */
        .overlay-screen {
            position: fixed;
            inset: 0;
            z-index: 9998;
            background: radial-gradient(ellipse at top, #0f1f3a 0%, #000 70%);
            color: #e2e8f0;
            display: flex;
            justify-content: center;
            align-items: safe center;
            overflow-y: auto;
            /* body disables touch gestures - allow vertical scrolling here */
            touch-action: pan-y;
            -webkit-user-select: text;
            user-select: text;
            padding: max(24px, env(safe-area-inset-top)) max(20px, env(safe-area-inset-right)) max(24px, env(safe-area-inset-bottom)) max(20px, env(safe-area-inset-left));
            box-sizing: border-box;
            transition: opacity 0.4s ease-out;
            color-scheme: dark;
            scrollbar-width: thin;
        }
        .overlay-screen.closing { opacity: 0; pointer-events: none; }
        .overlay-screen[hidden] { display: none; }

        /* Button stays visible at the bottom while scrolling */
        .wn-footer {
            position: sticky;
            bottom: 0;
            padding: 18px 0 4px;
            background: linear-gradient(to top, #000 55%, rgba(0, 0, 0, 0));
        }
        .wn-card { width: 100%; max-width: 520px; margin: auto 0; text-align: center; }

        /* Language switcher DE / EN / FR / IT */
        .wn-lang { display: flex; justify-content: flex-end; gap: 6px; margin-bottom: 4px; }
        .wn-lang button {
            min-width: 40px;
            height: 30px;
            padding: 0 8px;
            border-radius: 8px;
            border: 1px solid rgba(255, 255, 255, 0.12);
            background: rgba(15, 23, 42, 0.8);
            color: #cbd5e1;
            font-size: 13px;
            font-weight: 700;
            letter-spacing: 0.05em;
            cursor: pointer;
            transition: background 0.15s, color 0.15s;
        }
        .wn-lang button.active {
            background: #60a5fa;
            border-color: rgba(255, 255, 255, 0.35);
            color: #0f172a;
        }

        /* Tailwind preflight makes images block elements - center explicitly */
        .wn-logo { width: 76px; height: 76px; display: block; margin: 0 auto; }
        .wn-card h2 { margin: 12px 0 4px; font-size: 22px; font-weight: 700; color: #fff; letter-spacing: 0.01em; }
        .wn-subtitle { margin: 0 0 20px; font-size: 14px; color: #94a3b8; }

        .wn-list { list-style: none; margin: 0; padding: 0; text-align: left; display: flex; flex-direction: column; gap: 10px; }
        .wn-list li {
            display: flex;
            align-items: flex-start;
            gap: 12px;
            background: rgba(15, 23, 42, 0.75);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 12px;
            padding: 10px 12px;
        }
        .wn-icon {
            flex-shrink: 0;
            width: 36px;
            height: 36px;
            border-radius: 10px;
            background: rgba(96, 165, 250, 0.14);
            color: #60a5fa;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .wn-icon svg { width: 20px; height: 20px; }
        .wn-list strong { display: block; font-size: 14px; color: #fff; margin-bottom: 2px; }
        .wn-list span { display: block; font-size: 13px; line-height: 1.4; color: #94a3b8; }

        .wn-start {
            height: 48px;
            padding: 0 22px 0 26px;
            border-radius: 24px;
            border: 1px solid rgba(255, 255, 255, 0.35);
            background: #60a5fa;
            color: #0f172a;
            font-size: 16px;
            font-weight: 700;
            letter-spacing: 0.03em;
            display: inline-flex;
            align-items: center;
            gap: 10px;
            cursor: pointer;
            box-shadow: 0 4px 14px rgba(0, 0, 0, 0.35);
            transition: transform 0.15s, background 0.15s;
        }
        .wn-start:active { transform: scale(0.96); background: #3b82f6; }
        .wn-start svg { width: 22px; height: 22px; }

        /* Wide screens: two columns; an odd last card spans both */
        @media (min-width: 760px) {
            .wn-card { max-width: 820px; }
            .wn-list { display: grid; grid-template-columns: 1fr 1fr; }
            .wn-list li:last-child:nth-child(odd) { grid-column: 1 / -1; }
        }
    </style>
</head>
<body>

<!-- SPLASH SCREEN: Logo beim Start -->
<div id="splash-screen">
    <img src="logo.png" alt="Häusermanns Video Feedback App">
</div>

<div id="app">
    <video id="live-video" autoplay playsinline muted style="display:none"></video>

    <!-- Ansichten (werden per JS aus dem Template erzeugt) -->
    <main id="workbench"></main>

    <!-- Globale Buttons oben links -->
    <div class="top-left">
        <button id="fullscreen-btn" class="glass-btn" data-ui-title="fullscreen">
            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M8 3H5a2 2 0 0 0-2 2v3m18 0V5a2 2 0 0 0-2-2h-3m0 18h3a2 2 0 0 0 2-2v-3M3 16v3a2 2 0 0 0 2 2h3"/></svg>
        </button>
        <button id="split-btn" class="glass-btn" data-ui-title="split" aria-pressed="false">
            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="16" rx="2"/><path id="split-line" d="M12 4v16"/></svg>
        </button>
        <button id="grid-btn" class="glass-btn" data-ui-title="grid">
            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="2" ry="2"/><line x1="3" y1="9" x2="21" y2="9"/><line x1="3" y1="15" x2="21" y2="15"/><line x1="9" y1="3" x2="9" y2="21"/><line x1="15" y1="3" x2="15" y2="21"/></svg>
        </button>
        <button id="info-btn" class="glass-btn" data-ui-title="info" aria-haspopup="dialog">
            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><circle cx="12" cy="12" r="9"/><path d="M12 11v6"/><path d="M12 7.5h.01" stroke-width="3"/></svg>
        </button>
    </div>

    <!-- Oben rechts: Kamera wechseln (nur sichtbar, wenn es mehrere Kameras gibt) -->
    <div class="top-right">
        <button id="camera-btn" class="glass-btn" data-ui-title="camera" hidden>
            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 8a1 1 0 0 1 1-1h3l2-2h6l2 2h3a1 1 0 0 1 1 1v10a1 1 0 0 1-1 1H4a1 1 0 0 1-1-1z"/><path d="M8.5 13a3.5 3.5 0 0 1 6-2.4M15.5 13a3.5 3.5 0 0 1-6 2.4"/><path d="M14.8 8.6v2.2h-2.2M9.2 17.4v-2.2h2.2"/></svg>
        </button>
    </div>
</div>

<!-- Vorlage für eine Ansicht: eigenes Bild, eigene Verzögerung, eigene Steuerung -->
<template id="pane-template">
    <section class="pane">
        <canvas></canvas>
        <div class="grid-overlay"></div>
        <div class="status-msg" hidden>
            <div class="spinner"></div>
            <p class="status-text"></p>
        </div>
        <div class="pane-controls">
            <div class="ctl-row">
                <div class="timer-group">
                    <div>
                        <div class="delay-timer">5.0s</div>
                        <div class="timer-label">Verzögerung</div>
                    </div>
                    <button class="glass-btn reset-btn" data-ui-title="reset" hidden>
                        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12a9 9 0 1 0 3-6.7"/><path d="M3 4v5h5"/></svg>
                    </button>
                </div>
                <div class="ctl-group">
                    <button class="glass-btn speed-btn" data-ui-title="speed">1x</button>
                    <button class="pause-btn" type="button">
                        <svg class="icon-pause" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor"><rect x="6" y="5" width="4" height="14" rx="1"/><rect x="14" y="5" width="4" height="14" rx="1"/></svg>
                        <svg class="icon-play" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor" style="display:none"><path d="M8 5.5v13a1 1 0 0 0 1.5.86l10.5-6.5a1 1 0 0 0 0-1.72L9.5 4.64A1 1 0 0 0 8 5.5z"/></svg>
                    </button>
                </div>
            </div>
            <div class="slider-row">
                <span>0s</span>
                <input type="range" class="delay-slider" min="0" max="60" step="0.1" value="5">
                <span>60s</span>
            </div>
        </div>
    </section>
</template>

<!-- WILLKOMMEN: nach dem Splash, einmal pro Version. Deutsch steht im HTML, andere Sprachen aus WHATS_NEW_TEXT (JS) -->
<div id="whats-new" class="overlay-screen" role="dialog" aria-modal="true" aria-labelledby="wn-title" lang="de">
    <div class="wn-card">
        <div class="wn-lang" role="group" aria-label="Sprache / Language">
            <button type="button" data-lang="de" lang="de" title="Deutsch" aria-pressed="true" class="active">DE</button>
            <button type="button" data-lang="en" lang="en" title="English" aria-pressed="false">EN</button>
            <button type="button" data-lang="fr" lang="fr" title="Français" aria-pressed="false">FR</button>
            <button type="button" data-lang="it" lang="it" title="Italiano" aria-pressed="false">IT</button>
        </div>
        <img src="logo.png" alt="" class="wn-logo">
        <h2 id="wn-title" data-i18n="title">Willkommen</h2>
        <p class="wn-subtitle" data-i18n="subtitle">Neu in Version 1.1 – die wichtigsten Neuerungen auf einen Blick</p>

        <ul class="wn-list" id="wn-list"></ul>

        <div class="wn-footer">
            <button id="wn-start" class="wn-start" type="button">
                <span data-i18n="start">Los geht's</span>
                <svg fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" viewBox="0 0 24 24"><path d="M5 12h14M13 6l6 6-6 6"/></svg>
            </button>
        </div>
    </div>
</div>

<!-- INFO-BILDSCHIRM: Texte kommen pro Sprache aus HELP_TEXT (JS) -->
<div id="help-screen" class="overlay-screen" role="dialog" aria-modal="true" aria-labelledby="help-title" lang="de" hidden>
    <div class="wn-card">
        <div class="wn-lang" role="group" aria-label="Sprache / Language">
            <button type="button" data-lang="de" lang="de" title="Deutsch" aria-pressed="true" class="active">DE</button>
            <button type="button" data-lang="en" lang="en" title="English" aria-pressed="false">EN</button>
            <button type="button" data-lang="fr" lang="fr" title="Français" aria-pressed="false">FR</button>
            <button type="button" data-lang="it" lang="it" title="Italiano" aria-pressed="false">IT</button>
        </div>
        <img src="logo.png" alt="" class="wn-logo">
        <h2 id="help-title" data-help="title">Bedienung</h2>
        <p class="wn-subtitle" data-help="subtitle">So funktioniert die Video Feedback App</p>

        <ul class="wn-list" id="help-list"></ul>

        <div class="wn-footer">
            <button id="help-close" class="wn-start" type="button">
                <span data-help="close">Verstanden</span>
                <svg fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" viewBox="0 0 24 24"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>
            </button>
        </div>
    </div>
</div>

<script>
    /**
     * SERVICE WORKER (sw.js): speichert die App für den Offline-Betrieb.
     * Funktioniert nur über https:// oder localhost.
     */
    if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
            navigator.serviceWorker.register('./sw.js').catch(err => console.log('SW error', err));
        });
    }

    const CONFIG = {
        maxDelaySec: 60,
        fps: 30,
        touchSensitivityX: 0.1,      // s pro Pixel beim Wischen (laufend)
        pausedSensitivityX: 0.01,    // s pro Pixel beim Wischen im Standbild (feiner)
        zoomSensitivity: 0.005,
        panSensitivity: 1.8,
        maxZoom: 8.0,
        minZoom: 1.0,
        speeds: [1, 0.5, 0.25],
        defaultDelays: [5, 10],      // Ansicht 1 / Ansicht 2
        protectMs: 15000,            // Bilder rund um ein Standbild so lange behalten
        maxFrameSide: 960,           // Bilder im Puffer auf diese Länge (längste Seite) verkleinern
        reserveSec: 5                // Puffer = grösste Verzögerung + diese Reserve zum Zurückwischen
    };
    const MAX_BUFFER_MS = (CONFIG.maxDelaySec + 10) * 1000;

    /*
     * Zeitmodell: Alle Ansichten teilen sich einen Puffer mit Kamerabildern
     * (Zeitstempel = performance.now()). Jede Ansicht zeigt das Bild bei

    function createPane(index) {
        const el = document.getElementById('pane-template').content.firstElementChild.cloneNode(true);
        workbench.appendChild(el);
        const q = sel => el.querySelector(sel);
        const p = {
            index, el,
            canvas: q('canvas'),
            ctx: q('canvas').getContext('2d', { alpha: false }),
            gridEl: q('.grid-overlay'),
            statusEl: q('.status-msg'),
            statusText: q('.status-text'),
            spinner: q('.spinner'),
            timer: q('.delay-timer'),
            label: q('.timer-label'),
            slider: q('.delay-slider'),
            resetBtn: q('.reset-btn'),
            speedBtn: q('.speed-btn'),
            pauseBtn: q('.pause-btn'),
            iconPause: q('.icon-pause'),
            iconPlay: q('.icon-play'),
            delaySec: CONFIG.defaultDelays[index],
            lag: CONFIG.defaultDelays[index],
            rate: 1,
            paused: false,
            pausedAt: 0,
            zoom: 1,
            panX: 0,
            panY: 0,
            lastTimerText: ''
        };

        p.slider.addEventListener('input', () => {
            p.delaySec = parseFloat(p.slider.value);
            p.lag = p.delaySec;
            activePane = p;
        });
        p.slider.addEventListener('change', saveSettings);
        p.pauseBtn.addEventListener('click', () => { activePane = p; setPaused(p, !p.paused); });
        p.speedBtn.addEventListener('click', () => { activePane = p; cycleSpeed(p); });
        p.resetBtn.addEventListener('click', () => { activePane = p; resetPlayback(p); });
        el.addEventListener('pointerdown', () => { activePane = p; });
        attachTouch(p);

        // Canvas-Grösse folgt der Ansicht (Drehen, Teilen, Vollbild) - ohne
        // auf window.resize zu warten, das auf iOS beim Drehen zu früh kommt
        new ResizeObserver(() => sizeCanvas(p)).observe(el);
        sizeCanvas(p);
        return p;
    }

    function sizeCanvas(p) {
        const dpr = window.devicePixelRatio || 1;
        const w = Math.max(1, Math.round(p.el.clientWidth * dpr));
        const h = Math.max(1, Math.round(p.el.clientHeight * dpr));
        // Nur bei echter Änderung setzen: width/height löschen das Canvas
        if (p.canvas.width !== w || p.canvas.height !== h) {
            p.canvas.width = w;
            p.canvas.height = h;
            drawPane(p, performance.now());   // sofort neu zeichnen, kein Flackern
        }
    }

    function setViews(n) {
        state.views = n === 2 ? 2 : 1;
        panes[1].el.hidden = state.views < 2;
        appEl.classList.toggle('dual', state.views === 2);
        splitBtn.classList.toggle('on', state.views === 2);
        splitBtn.setAttribute('aria-pressed', String(state.views === 2));
        if (state.views < 2 && activePane === panes[1]) activePane = panes[0];
        updateShortLayout();
    }

    // Wenig Höhe (Handy quer): kompakte Steuerung
    function updateShortLayout() {
        appEl.classList.toggle('short', window.innerHeight < 500);

        const landscape = window.innerWidth >= window.innerHeight;
        document.getElementById('split-line').setAttribute('d', landscape ? 'M12 4v16' : 'M3 12h18');

    // =================================================================
    // EINSTELLUNGEN MERKEN
    // =================================================================
    const SETTINGS_KEY = 'videoDelaySettings';
    const validDelay = v => typeof v === 'number' && v >= 0 && v <= CONFIG.maxDelaySec;

    function loadSettings() {
        let s = {};
        try { s = JSON.parse(localStorage.getItem(SETTINGS_KEY) || '{}') || {}; } catch (e) { /* blocked or invalid */ }
        const delays = Array.isArray(s.delays) ? s.delays : (validDelay(s.delaySec) ? [s.delaySec] : []);
        panes.forEach((p, i) => {
            if (validDelay(delays[i])) p.delaySec = delays[i];
            p.lag = p.delaySec;
            p.slider.value = p.delaySec;
        });
        if (Number.isInteger(s.gridMode) && s.gridMode >= 0 && s.gridMode <= 4) state.gridMode = s.gridMode;
        if (s.facing === 'user' || s.facing === 'environment') state.facing = s.facing;
        if (APP_LANGS.includes(s.lang)) appLang = s.lang;
        setViews(s.views === 2 ? 2 : 1);
    }

    function saveSettings() {
        try {
            localStorage.setItem(SETTINGS_KEY, JSON.stringify({
                delays: panes.map(p => p.delaySec), views: state.views,
                gridMode: state.gridMode, facing: state.facing, lang: appLang
            }));
        } catch (e) { /* storage blocked */ }
    }

    // =================================================================
    // KAMERA (inkl. Wechsel Rück-/Frontkamera)
    // =================================================================
    let currentStream = null;
    let currentDeviceId = null;
    let videoDevices = [];
    let renderStarted = false;
    let cameraError = false;

    function stopCamera() {
        if (currentStream) currentStream.getTracks().forEach(t => t.stop());
        currentStream = null;
    }

    async function startCamera(deviceId) {
        stopCamera();
        cameraError = false;
        const base = { width: { ideal: 1920 }, height: { ideal: 1080 } };
        const attempts = deviceId
            ? [{ ...base, deviceId: { exact: deviceId } }]
            : [{ ...base, facingMode: { exact: state.facing } }, { ...base, facingMode: state.facing }];
        let stream = null;
        for (const constraints of attempts) {
            try { stream = await navigator.mediaDevices.getUserMedia({ video: constraints, audio: false }); break; }
            catch (e) { /* nächsten Versuch */ }
        }
        if (!stream) {
            cameraError = true;
            return false;
        }
        currentStream = stream;
        const track = stream.getVideoTracks()[0];
        const settings = track.getSettings ? track.getSettings() : {};
        currentDeviceId = settings.deviceId || null;
        // Frontkamera spiegeln (Desktop-Webcams melden oft keinen facingMode)
        state.mirror = (settings.facingMode || state.facing) === 'user';
        track.addEventListener('ended', () => { if (document.visibilityState === 'visible') startCamera(); });

        video.srcObject = stream;
        video.onloadedmetadata = () => {
            video.play().catch(() => {});
            if (!renderStarted) { renderStarted = true; requestAnimationFrame(renderLoop); }
        };

        // Kamera-Button nur zeigen, wenn es mehr als eine Kamera gibt
        try {
            videoDevices = (await navigator.mediaDevices.enumerateDevices()).filter(d => d.kind === 'videoinput');
        } catch (e) { videoDevices = []; }
        cameraBtn.hidden = videoDevices.length < 2;
        requestWakeLock();
        return true;
    }

    async function switchCamera() {
        cameraBtn.disabled = true;
        const prevId = currentDeviceId;
        state.facing = state.facing === 'user' ? 'environment' : 'user';
        await startCamera();
        // Desktop mit zwei Webcams: facingMode hilft nicht, also die nächste Kamera nehmen
        if (prevId && currentDeviceId === prevId && videoDevices.length > 1) {
            const i = videoDevices.findIndex(d => d.deviceId === prevId);
            await startCamera(videoDevices[(i + 1) % videoDevices.length].deviceId);
        }
        saveSettings();
        cameraBtn.disabled = false;
    }

    // BILDSCHIRM BLEIBT AN (Screen Wake Lock)
    // =================================================================
    let wakeLock = null;

    async function requestWakeLock() {
        if (!('wakeLock' in navigator) || wakeLock || document.visibilityState !== 'visible') return;
        try {
            wakeLock = await navigator.wakeLock.request('screen');
            wakeLock.addEventListener('release', () => { wakeLock = null; });
        } catch (e) { /* nicht erlaubt (z. B. Energiesparmodus) */ }
    }

    // =================================================================
    // GEMEINSAMER PUFFER
    // =================================================================
    let captureBusy = false;
    let captureEpoch = 0;   // erhöht bei Zeitverschiebung: verwirft Bilder, die gerade noch entstehen
    let hiddenAt = null;
    let windowStart = performance.now();   // Zeit des ältesten Bildes im normalen Puffer-Fenster

    // Nur so viel Puffer behalten, wie die sichtbaren Ansichten brauchen
    // (grösste Verzögerung bzw. in Zeitlupe gewachsene Verzögerung + Reserve)
    function keepMs() {
        let need = 0;
        for (const p of panes) {
            if (p.el.hidden) continue;
            need = Math.max(need, p.delaySec, p.paused ? 0 : p.lag);
        }
        return Math.min(MAX_BUFFER_MS, (need + CONFIG.reserveSec) * 1000);
    }

    // Alte Bilder freigeben - ausser rund um das Standbild einer pausierten Ansicht
    function trimBuffer(now) {
        const keepFrom = now - keepMs();
        if (!state.buffer.length || state.buffer[0].time >= keepFrom) return;
        const keep = panes.filter(p => p.paused).map(p => {
            const t = p.pausedAt - p.lag * 1000;
            return [t - CONFIG.protectMs, t + CONFIG.protectMs];
        });
        if (!keep.length) {
            while (state.buffer.length && state.buffer[0].time < keepFrom) state.buffer.shift().bitmap.close();
            return;
        }
        state.buffer = state.buffer.filter(f => {
            if (f.time >= keepFrom || keep.some(([a, b]) => f.time >= a && f.time <= b)) return true;
            f.bitmap.close();
            return false;
        });
    }

    // Kamerabild verkleinert als ImageBitmap: Ein 1080p-Bild braucht 8 MB,
    // ein 960er nur 2 MB. Erst über die Resize-Optionen von createImageBitmap,
    // falls der Browser sie ignoriert (älteres Safari) über ein Hilfs-Canvas.
    let resizeMode = 'options';
    let scaleCanvas = null, scaleCtx = null;

    function frameSize() {
        const vw = video.videoWidth, vh = video.videoHeight;
        if (!vw || !vh) return null;
        const s = Math.min(1, CONFIG.maxFrameSide / Math.max(vw, vh));
        return { w: Math.round(vw * s), h: Math.round(vh * s), scaled: s < 1 };
    }

    function bitmapViaCanvas(t) {
        if (!scaleCanvas) {
            scaleCanvas = document.createElement('canvas');
            scaleCtx = scaleCanvas.getContext('2d', { alpha: false });
        }
        if (scaleCanvas.width !== t.w || scaleCanvas.height !== t.h) {
            scaleCanvas.width = t.w;
            scaleCanvas.height = t.h;
        }
        scaleCtx.drawImage(video, 0, 0, t.w, t.h);
        return createImageBitmap(scaleCanvas);
    }

    function makeFrameBitmap() {
        const t = frameSize();
        if (!t) return Promise.reject(new Error('no video size'));
        if (!t.scaled) return createImageBitmap(video);
        if (resizeMode === 'canvas') return bitmapViaCanvas(t);
        return createImageBitmap(video, { resizeWidth: t.w, resizeHeight: t.h, resizeQuality: 'medium' })
            .then(b => {
                if (b.width <= t.w + 1) return b;
                b.close();                 // Optionen ignoriert: ab jetzt Canvas
                resizeMode = 'canvas';
                return bitmapViaCanvas(t);
            })
            .catch(() => { resizeMode = 'canvas'; return bitmapViaCanvas(t); });
    }

    function captureFrame(now) {
        if (captureBusy || hiddenAt !== null || !currentStream) return;
        if (video.readyState < video.HAVE_CURRENT_DATA) return;
        // 4 ms Toleranz: Bei 60 Hz kommt requestAnimationFrame alle ~16,7 ms.
        // Ohne Toleranz verpasst 33,3 ms wegen Rundung oft knapp den zweiten
        // Takt und es wurden nur ~22 statt 30 Bilder pro Sekunde aufgenommen.
        if (now - state.lastCapture < 1000 / CONFIG.fps - 4) return;
        state.lastCapture = now;
        captureBusy = true;
        const epoch = captureEpoch;
        const mirror = state.mirror;
        makeFrameBitmap().then(bitmap => {
            captureBusy = false;
            if (epoch !== captureEpoch) { bitmap.close(); return; }
            state.buffer.push({ bitmap, time: now, mirror });
            trimBuffer(now);
        }).catch(() => { captureBusy = false; });
    }

    // Alle Zeitstempel verschieben: Nach dem Hintergrund läuft das verzögerte
    // Bild nahtlos dort weiter, wo es aufgehört hat.
    function shiftTime(ms) {
        for (const f of state.buffer) f.time += ms;
        for (const p of panes) if (p.paused) p.pausedAt += ms;
        captureEpoch++;
    }

    function updateWindowStart(now) {
        const from = now - keepMs();
        windowStart = now;
        for (const f of state.buffer) { if (f.time >= from) { windowStart = f.time; break; } }
    }

    const refTime = (p, now) => p.paused ? p.pausedAt : now;

    // Index des angezeigten Bildes (neuestes Bild mit time <= Zielzeit)
    function frameIndexAt(target) {
        const buf = state.buffer;
        for (let i = buf.length - 1; i >= 0; i--) {
            if (buf[i].time <= target + 0.5) return i;
        }
        return -1;
    }

    function maxLag(p, now) {
        // Standbild: so weit zurück, wie Bilder da sind. Laufend: im normalen
        // Fenster bleiben, darf aber die eingestellte Verzögerung erreichen
        // (Puffer füllt sich noch).
        if (p.paused) return state.buffer.length ? Math.max(0, (p.pausedAt - state.buffer[0].time) / 1000) : 0;
        return Math.max((now - windowStart) / 1000, p.delaySec);
    }

    // =================================================================
    // PAUSE / STANDBILD, ZEITLUPE, RESET (pro Ansicht)
    // =================================================================
    function setPaused(p, paused) {
        if (paused === p.paused) return;
        const now = performance.now();
        if (paused) {
            p.pausedAt = now;
            p.paused = true;
        } else {
            // An derselben Stelle weiter: die Verzögerung wächst um die Pausendauer
            p.lag += (now - p.pausedAt) / 1000;
            p.paused = false;
            p.lag = Math.min(p.lag, maxLag(p, now));
        }
        updateControls(p);
    }

    function cycleSpeed(p) {
        const i = CONFIG.speeds.indexOf(p.rate);
        p.rate = CONFIG.speeds[(i + 1) % CONFIG.speeds.length];
        updateControls(p);
    }

    function resetPlayback(p) {
        setPaused(p, false);
        p.rate = 1;
        p.lag = p.delaySec;
        updateControls(p);
    }

    function stepFrame(p, dir) {   // dir -1 = älter, +1 = neuer
        if (!p.paused) setPaused(p, true);
        if (!state.buffer.length) return;
        let idx = frameIndexAt(p.pausedAt - p.lag * 1000);
        if (idx < 0) idx = 0;
        // Höherer Index = neueres Bild = kleinere Verzögerung
        const target = Math.max(0, Math.min(state.buffer.length - 1, idx + dir));
        p.lag = Math.max(0, (p.pausedAt - state.buffer[target].time) / 1000);
    }

    function updateControls(p) {
        const ui = UI_TEXT[appLang];
        p.iconPause.style.display = p.paused ? 'none' : '';
        p.iconPlay.style.display = p.paused ? '' : 'none';
        p.pauseBtn.title = ui[p.paused ? 'play' : 'pause'];
        p.pauseBtn.setAttribute('aria-label', p.pauseBtn.title);
        p.pauseBtn.setAttribute('aria-pressed', String(p.paused));
        p.speedBtn.textContent = SPEED_LABEL[p.rate];
        p.speedBtn.classList.toggle('slow', p.rate !== 1);
        p.timer.classList.toggle('frozen', p.paused);
        p.label.textContent = p.paused ? ui.frozen : ui.delay;
    }

    // =================================================================
    // DARSTELLUNG
    // =================================================================
    function showStatus(p, text, spinner) {
        p.statusEl.hidden = false;
        p.spinner.style.display = spinner ? '' : 'none';
        if (p.statusText.textContent !== text) p.statusText.textContent = text;
    }

    function drawPane(p, now) {
        const ui = UI_TEXT[appLang];
        if (cameraError) { showStatus(p, ui.camError, false); return; }
        if (!state.buffer.length) { showStatus(p, ui.starting, true); return; }

        let idx = frameIndexAt(refTime(p, now) - p.lag * 1000);
        if (idx < 0) {
            const span = (refTime(p, now) - state.buffer[0].time) / 1000;
            const pct = p.lag > 0 ? Math.min(100, Math.round(span / p.lag * 100)) : 100;
            showStatus(p, `${ui.buffering} ${pct}%`, true);
            idx = 0;
        } else {
            p.statusEl.hidden = true;
        }

        const frame = state.buffer[idx];
        const b = frame.bitmap;
        const cw = p.canvas.width, ch = p.canvas.height;
        const dpr = window.devicePixelRatio || 1;
        // Ganzes Bild zeigen (contain): Nach dem Drehen haben die Bilder im
        // Puffer noch das alte Seitenverhältnis - so wird nichts abgeschnitten
        const scale = Math.min(cw / b.width, ch / b.height) * p.zoom;
        const dw = b.width * scale, dh = b.height * scale;
        // Verschieben nur so weit, dass das gezoomte Bild die Ansicht nicht verlässt
        const maxPX = Math.max(0, (dw - cw) / 2) / dpr;
        const maxPY = Math.max(0, (dh - ch) / 2) / dpr;
        p.panX = Math.max(-maxPX, Math.min(maxPX, p.panX));
        p.panY = Math.max(-maxPY, Math.min(maxPY, p.panY));
        const x = (cw - dw) / 2 + (frame.mirror ? -p.panX : p.panX) * dpr;
        const y = (ch - dh) / 2 + p.panY * dpr;

        const ctx = p.ctx;
        ctx.save();
        ctx.fillStyle = '#000';
        ctx.fillRect(0, 0, cw, ch);
        if (frame.mirror) { ctx.translate(cw, 0); ctx.scale(-1, 1); }
        ctx.drawImage(b, x, y, dw, dh);
        ctx.restore();
    }

    let lastTs = null;

    function renderLoop(now) {
        requestAnimationFrame(renderLoop);
        const dt = lastTs === null ? 0 : Math.min(0.1, (now - lastTs) / 1000);
        lastTs = now;

        captureFrame(now);
        updateWindowStart(now);

        for (const p of panes) {
            if (p.el.hidden) continue;
            // Zeitlupe: das Bild läuft langsamer als die Zeit, die Verzögerung wächst
            if (!p.paused && p.rate !== 1) p.lag += (1 - p.rate) * dt;
            p.lag = Math.max(0, Math.min(maxLag(p, now), p.lag));

            // Reset-Button nur bei Abweichung von der eingestellten Verzögerung
            p.resetBtn.hidden = !(p.paused || p.rate !== 1 || Math.abs(p.lag - p.delaySec) > 0.05);
            const timerText = p.lag.toFixed(1) + 's';
            if (timerText !== p.lastTimerText) { p.timer.textContent = timerText; p.lastTimerText = timerText; }

            drawPane(p, now);
        }
    }

    // =================================================================
    // GESTEN PRO ANSICHT: Wischen (Zeit), Pinch (Zoom + Verschieben)
    // =================================================================
    function attachTouch(p) {
        let lastX = 0, lastPinchDist = 0, lastMidX = 0, lastMidY = 0;
        const c = p.canvas;
        const pinch = t => ({
            dist: Math.hypot(t[0].clientX - t[1].clientX, t[0].clientY - t[1].clientY),
            x: (t[0].clientX + t[1].clientX) / 2,
            y: (t[0].clientY + t[1].clientY) / 2
        });

        c.addEventListener('touchstart', e => {
            activePane = p;
            if (e.touches.length === 1) {
                lastX = e.touches[0].clientX;
            } else if (e.touches.length === 2) {
                const m = pinch(e.touches);
                lastPinchDist = m.dist; lastMidX = m.x; lastMidY = m.y;
            }
        }, { passive: false });

        // Nach Pinch mit einem Finger weiter: Startpunkt neu setzen, kein Sprung
        c.addEventListener('touchend', e => {
            if (e.touches.length === 1) lastX = e.touches[0].clientX;
        });

        c.addEventListener('touchmove', e => {
            e.preventDefault();
            if (e.touches.length === 1) {
                const deltaX = lastX - e.touches[0].clientX;
                const sens = p.paused ? CONFIG.pausedSensitivityX : CONFIG.touchSensitivityX;
                p.lag = Math.max(0, Math.min(maxLag(p, performance.now()), p.lag + deltaX * sens));
                lastX = e.touches[0].clientX;
            } else if (e.touches.length === 2) {
                const m = pinch(e.touches);
                p.zoom = Math.max(CONFIG.minZoom, Math.min(CONFIG.maxZoom, p.zoom + (m.dist - lastPinchDist) * CONFIG.zoomSensitivity));
                if (p.zoom > 1.0) {
                    p.panX += (m.x - lastMidX) * CONFIG.panSensitivity;
                    p.panY += (m.y - lastMidY) * CONFIG.panSensitivity;
                } else {
                    p.panX = 0; p.panY = 0;
                }
                lastPinchDist = m.dist; lastMidX = m.x; lastMidY = m.y;
            }
        }, { passive: false });
    }

    // =================================================================
    // RASTER, VOLLBILD, ZWEI ANSICHTEN
    // =================================================================
    function renderGrid() {
        const divisions = [0, 4, 6, 8, 10][state.gridMode];
        for (const p of panes) {
            p.gridEl.innerHTML = '';
            for (let i = 1; i < divisions; i++) {
                const v = document.createElement('div');
                v.className = 'grid-line';
                v.style.width = '1px'; v.style.height = '100%'; v.style.left = (100 / divisions * i) + '%';
                p.gridEl.appendChild(v);
                const h = document.createElement('div');
                h.className = 'grid-line';
                h.style.height = '1px'; h.style.width = '100%'; h.style.top = (100 / divisions * i) + '%';
                p.gridEl.appendChild(h);
            }
        }
    }

    function toggleGrid() {
        state.gridMode = (state.gridMode + 1) % 5;
        renderGrid();
        saveSettings();
    }

    function toggleSplit() {
        setViews(state.views === 2 ? 1 : 2);
        saveSettings();
    }

    function toggleFullscreen() {
        const el = document.documentElement;
        if (!document.fullscreenElement && !document.webkitFullscreenElement) {
            (el.requestFullscreen || el.webkitRequestFullscreen || (() => {})).call(el);
        } else {
            (document.exitFullscreen || document.webkitExitFullscreen || (() => {})).call(document);
        }
    }

    // =================================================================
    // SPRACHE, WILLKOMMEN, INFO
    // =================================================================
    const helpScreen = document.getElementById('help-screen');
    let helpOpen = false;
    let whatsNewOpen = false;

    function fillList(listEl, order, texts) {
        listEl.innerHTML = '';
        order.forEach(([key, icon]) => {
            const [title, desc] = texts[key];
            const li = document.createElement('li');
            li.innerHTML = '<div class="wn-icon"><svg fill="none" stroke="currentColor" stroke-width="2" ' +
                'stroke-linecap="round" stroke-linejoin="round" viewBox="0 0 24 24">' + ICONS[icon] +
                '</svg></div><div><strong></strong><span></span></div>';
            // textContent: no HTML injection
            li.querySelector('strong').textContent = title;
            li.querySelector('span').textContent = desc;
            listEl.appendChild(li);
        });
    }

    function applyLanguage() {
        document.documentElement.lang = appLang;
        const wn = document.getElementById('whats-new');
        if (wn) {
            const t = WHATS_NEW_TEXT[appLang];
            wn.setAttribute('lang', appLang);
            wn.querySelectorAll('[data-i18n]').forEach(n => { n.textContent = t[n.dataset.i18n]; });
            fillList(document.getElementById('wn-list'), WHATS_NEW_ITEMS, t);
        }
        const h = HELP_TEXT[appLang];
        helpScreen.setAttribute('lang', appLang);
        helpScreen.querySelectorAll('[data-help]').forEach(n => { n.textContent = h[n.dataset.help]; });
        fillList(document.getElementById('help-list'), HELP_ITEMS, h);

        document.querySelectorAll('.wn-lang button').forEach(btn => {
            const active = btn.dataset.lang === appLang;
            btn.classList.toggle('active', active);
            btn.setAttribute('aria-pressed', String(active));
        });
        document.querySelectorAll('[data-ui-title]').forEach(btn => {
            btn.title = UI_TEXT[appLang][btn.dataset.uiTitle];
            btn.setAttribute('aria-label', btn.title);
        });
        panes.forEach(updateControls);
    }

    function setAppLanguage(lang) {
        appLang = APP_LANGS.includes(lang) ? lang : 'de';
        saveSettings();
        applyLanguage();
    }

    document.querySelectorAll('.wn-lang button').forEach(btn =>
        btn.addEventListener('click', () => setAppLanguage(btn.dataset.lang)));

    function openHelp() {
        if (helpOpen) return;
        helpOpen = true;
        helpScreen.classList.remove('closing');
        helpScreen.hidden = false;
        helpScreen.scrollTop = 0;
    }

    function closeHelp() {
        if (!helpOpen) return;
        helpOpen = false;
        helpScreen.classList.add('closing');
        setTimeout(() => { if (!helpOpen) helpScreen.hidden = true; }, 400);
    }

    function closeWhatsNew() {
        if (!whatsNewOpen) return;
        whatsNewOpen = false;
        try { localStorage.setItem('videoDelayWhatsNewSeen', WHATS_NEW_VERSION); } catch (e) { /* storage blocked */ }
        const el = document.getElementById('whats-new');
        el.classList.add('closing');
        setTimeout(() => el.remove(), 400);
        startApp();
    }

    // =================================================================
    // START
    // =================================================================
    let appStarted = false;

    async function startApp() {
        if (appStarted) return;
        appStarted = true;
        panes.forEach(p => showStatus(p, UI_TEXT[appLang].starting, true));
        if (!(await startCamera())) panes.forEach(p => showStatus(p, UI_TEXT[appLang].camError, false));
    }

    document.getElementById('grid-btn').onclick = toggleGrid;
    document.getElementById('fullscreen-btn').onclick = toggleFullscreen;
    document.getElementById('info-btn').onclick = openHelp;
    document.getElementById('help-close').onclick = closeHelp;
    document.getElementById('wn-start').onclick = closeWhatsNew;
    splitBtn.onclick = toggleSplit;
    cameraBtn.onclick = switchCamera;

    window.addEventListener('keydown', e => {
        if (whatsNewOpen) {
            if (['Enter', 'NumpadEnter', 'Space', 'Escape'].includes(e.code)) { e.preventDefault(); closeWhatsNew(); }
            return;
        }
        if (helpOpen) {
            if (['Enter', 'NumpadEnter', 'Escape'].includes(e.code)) { e.preventDefault(); closeHelp(); }
            return;
        }
        if (e.ctrlKey || e.metaKey || e.altKey) return;
        // Pfeiltasten auf einem Schieber nicht abfangen
        if (e.target.classList && e.target.classList.contains('delay-slider') && e.code.startsWith('Arrow')) return;
        const p = activePane || panes[0];
        if (e.code === 'Space') { e.preventDefault(); setPaused(p, !p.paused); }
        else if (e.code === 'ArrowLeft') { e.preventDefault(); stepFrame(p, -1); }
        else if (e.code === 'ArrowRight') { e.preventDefault(); stepFrame(p, 1); }
    });

    // Hintergrund: Kamera liefert keine Bilder - danach nahtlos weiter,
    // Kamera bei Bedarf neu starten und Wake Lock neu anfordern
    document.addEventListener('visibilitychange', () => {
        const now = performance.now();
        if (document.visibilityState === 'hidden') {
            hiddenAt = now;
            return;
        }
        if (hiddenAt !== null) { shiftTime(now - hiddenAt); hiddenAt = null; }
        const track = currentStream && currentStream.getVideoTracks()[0];
        if (appStarted && !cameraError && (!track || track.readyState === 'ended')) startCamera();
        requestWakeLock();
    });

    // Drehen: Layout sofort anpassen; die Canvas-Grössen folgen über
    // ResizeObserver. iOS meldet die neue Grösse teils erst verzögert,
    // daher zusätzlich kurz nach dem Drehen nochmals prüfen.
    function onViewportChange() {
        updateShortLayout();
        panes.forEach(sizeCanvas);
    }
    window.addEventListener('resize', onViewportChange);
    if (screen.orientation) screen.orientation.addEventListener('change', () => {
        onViewportChange();
        setTimeout(onViewportChange, 300);
    });
    window.addEventListener('orientationchange', () => setTimeout(onViewportChange, 300));
    if (window.visualViewport) window.visualViewport.addEventListener('resize', onViewportChange);

    panes.push(createPane(0), createPane(1));
    activePane = panes[0];
    loadSettings();
    renderGrid();
    applyLanguage();

    (function initWhatsNew() {
        let seen = null;
        try { seen = localStorage.getItem('videoDelayWhatsNewSeen'); } catch (e) { /* storage blocked */ }
        if (seen === WHATS_NEW_VERSION) {
            document.getElementById('whats-new').remove();
            startApp();   // Kamera startet schon hinter dem Splash
        } else {
            whatsNewOpen = true;   // Kamera startet mit "Los geht's"
        }
    })();

    // Splash nach 2 s ausblenden
    window.addEventListener('load', () => {
        setTimeout(() => {
            const splash = document.getElementById('splash-screen');
            splash.classList.add('fade');
            setTimeout(() => splash.remove(), 600);
        }, 2000);
    });
</script>
</body>
</html>
